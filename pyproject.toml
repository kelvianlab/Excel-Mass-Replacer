[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-mass-replacer"
version = "1.0.0"
description = "Headless mass find-and-replace across Excel files, without opening Microsoft Excel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KelvianLab" }]
keywords = ["excel", "xlsx", "xls", "find-and-replace", "batch", "openpyxl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.2",
    "xlrd==2.0.1",
    "xlwt==1.3.0",
    "xlutils==2.0.0",
]

[project.urls]
Homepage = "https://github.com/kelvianlab/Excel-Mass-Replacer"
Issues = "https://github.com/kelvianlab/Excel-Mass-Replacer/issues"

[project.scripts]
excel-mass-replacer = "excel_mass_replacer.cli:main"

[project.gui-scripts]
excel-mass-replacer-gui = "excel_mass_replacer.gui:main"

[tool.setuptools]
packages = ["excel_mass_replacer"]
