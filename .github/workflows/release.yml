name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run the test suite first
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Build the desktop app
        run: >
          pyinstaller --clean --noconfirm --onefile --windowed
          --name ExcelMassReplacer-App --paths . packaging/gui_entry.py

      - name: Build the command-line app
        run: >
          pyinstaller --clean --noconfirm --onefile --console
          --name ExcelMassReplacer-CommandLine --paths . packaging/cli_entry.py

      - name: Smoke-test the built executable end to end
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          python -c @"
          import openpyxl, xlwt
          wb = openpyxl.Workbook(); ws = wb.active
          ws['A1'] = 'Acme Holdings'; ws['A2'] = 'Invoice for Acme'; ws['A3'] = 123
          wb.save('smoke/modern.xlsx')
          b = xlwt.Workbook(); s = b.add_sheet('S'); s.write(0, 0, 'Acme legacy')
          b.save('smoke/old.xls')
          "@
          .\dist\ExcelMassReplacer-CommandLine.exe --version
          .\dist\ExcelMassReplacer-CommandLine.exe "Acme" "Globex" -d smoke --apply --no-backup -q
          python -c @"
          import openpyxl, xlrd, sys
          x = openpyxl.load_workbook('smoke/modern.xlsx').active
          legacy = xlrd.open_workbook('smoke/old.xls').sheet_by_index(0).cell_value(0, 0)
          assert x['A1'].value == 'Globex Holdings', x['A1'].value
          assert x['A2'].value == 'Invoice for Globex', x['A2'].value
          assert x['A3'].value == 123, x['A3'].value
          assert legacy == 'Globex legacy', legacy
          print('smoke test passed: xlsx and xls both rewritten by the frozen exe')
          "@

      - name: Check the desktop app starts without crashing
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\ExcelMassReplacer-App.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "ExcelMassReplacer-App.exe exited on its own with code $($p.ExitCode)"
          }
          $count = (Get-Process ExcelMassReplacer-App -ErrorAction SilentlyContinue).Count
          Write-Host "ExcelMassReplacer-App processes running: $count"
          if ($count -gt 2) {
            throw "Runaway process spawning: $count copies of the app are running"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "desktop app started, stayed up, and did not multiply"

      - uses: actions/upload-artifact@v4
        with:
          name: ExcelMassReplacer-windows
          path: |
            dist/ExcelMassReplacer-App.exe
            dist/ExcelMassReplacer-CommandLine.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          name: >-
            Excel Mass Replacer
            ${{ inputs.version || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## Which file do I download?

            ### 👉 `ExcelMassReplacer-App.exe` — this one

            **Almost everybody wants this file.** Download it, double-click it,
            and a window opens. No Python, no installation, no Microsoft Excel.
            Everything it needs is already inside the file.

            ### `ExcelMassReplacer-CommandLine.exe` — only if you type commands

            The same tool with no window, driven by typed commands instead.
            Useful for scheduling or scripting. If that does not sound like
            something you want, ignore this file.

            ### `Source code (zip)` and `(tar.gz)`

            Added automatically by GitHub. These are **not** the app — they are
            the programming files. You do not need them to use the tool.

            ---

            ### The first time you run it

            Windows will say **"Windows protected your PC"**. That is because
            the file is not code-signed, not because anything is wrong with it.
            Click **More info**, then **Run anyway**. You are only asked once.

            Both executables were built from this exact commit by GitHub
            Actions, and run against a real .xlsx and a real .xls file to
            confirm they work before this release was published.
          files: |
            dist/ExcelMassReplacer-App.exe
            dist/ExcelMassReplacer-CommandLine.exe
